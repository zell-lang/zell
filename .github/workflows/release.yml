# Release: on a pushed tag v<version> (the version in Cargo.toml, e.g.
# v0.1.0), or by hand (workflow_dispatch with a tag), builds the toolchain
# archives on every tier-1 host with scripts/package-toolchain.sh and the
# cross-built runtime archives that `zell target add` downloads, writes a
# .sha256 next to each archive plus SHA256SUMS and VERSION (install.sh /
# install.ps1 read VERSION from releases/latest/download), and creates the
# GitHub Release with all of them. The test suites run in ci.yml, not here.
#
# Every host archive is self-contained (docs/PLATFORMS.md, "Дистрибутив"):
# bin/lld (scripts/build-lld.sh, per host) and targets/ with the link inputs
# of every tier-1/2 target, built once: the `targets` job on Linux
# (scripts/bundle-targets.sh: glibc 2.31 stubs, musl, mingw-w64, compiler-rt,
# runtimes) and `targets-macos` on a Mac (the macOS runtimes against the real
# SDK, libSystem.tbd checked against it).
#
# Release candidates: the tag may be v<version>-rc.<n> (also -beta.<n>,
# -alpha.<n>); only the v<version> part must match Cargo.toml. Archives, the
# runtime archives and VERSION are then named by the tag without "v"
# (zell-0.1.0-rc.1-macos-arm64.tar.xz; package-toolchain.sh --version), the
# tag need not exist (the release creates it on the built commit, which is
# the commit this workflow was started on), and the GitHub Release is marked
# pre-release, so it never becomes `releases/latest` (what install.sh reads);
# install it with `install.sh --version 0.1.0-rc.1`.
#
# Assets of release v<version>:
#   zell-<version>-<host>.tar.xz(.sha256)          host: linux-amd64, linux-arm64,
#                                                  macos-arm64, macos-amd64, windows-amd64
#                                                  (windows-amd64 also .tar.gz)
#   zell-runtime-<version>-<triple>.tar.gz(.sha256) one per runtime that built
#   SHA256SUMS, VERSION
# Prebuilt inputs: bundle-targets.sh and build-lld.sh are called with
# --prebuilt, which first downloads the matching archive from the release
# `toolchain-inputs` (built by inputs.yml, keyed by `scripts/bundle-targets.sh
# --print-key` and `scripts/build-lld.sh --print-key`); the actions/cache steps
# stay as a second layer. The link inputs come in two layers with their own
# keys (`--print-key` prints `external=<ekey> runtime=<rkey>`). inputs.yml must
# be re-run by hand after scripts/bundle-targets.sh or scripts/build-lld.sh
# change (`-f layer=external` or all) and after runtime/ or
# scripts/lld/darwin-symbols.txt change (`-f layer=runtime`, 1-2 minutes).
# Without a matching asset a run still works, it just builds that layer here
# (about 30 minutes instead of 10 if both are missing).
name: release

# Manual only (workflow_dispatch; a tag push no longer releases by itself).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release: v<version> (must match Cargo.toml) or a candidate v<version>-rc.<n> (-beta.<n>, -alpha.<n>: published as a pre-release); need not exist yet"
        required: true
      dry_run:
        description: "Build and upload the assets as workflow artifacts only (no GitHub Release)"
        type: boolean
        default: true
      hosts:
        description: "Hosts to build: all, or linux (linux-amd64 + linux-arm64 only; the other hosts can be added to the same release later by re-running with hosts=all)"
        type: choice
        options: [all, linux]
        default: all

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}

jobs:
  meta:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      ref: ${{ steps.r.outputs.ref }}
      unix_matrix: ${{ steps.m.outputs.unix_matrix }}
      smoke_matrix: ${{ steps.m.outputs.smoke_matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      # What to build: an existing tag (a real release of it), else the commit
      # this workflow was started on (a dry run, or a new tag, which the
      # release job creates on that commit).
      - id: r
        name: Commit to build
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          ref=$GITHUB_SHA
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            ref=$TAG
          elif [ "$DRY_RUN" != true ] && git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            ref=$TAG
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "building $ref"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.r.outputs.ref }}
      - id: m
        name: Hosts to build
        env:
          HOSTS: ${{ github.event_name == 'push' && 'all' || inputs.hosts }}
        run: |
          linux='{"host":"linux-amd64","os":"ubuntu-24.04"},{"host":"linux-arm64","os":"ubuntu-24.04-arm","optional":true}'
          macos='{"host":"macos-arm64","os":"macos-14"},{"host":"macos-amd64","os":"macos-15-intel"}'
          if [ "$HOSTS" = linux ]; then m="[$linux]"; else m="[$linux,$macos]"; fi
          echo "unix_matrix=$m" >> "$GITHUB_OUTPUT"
          echo "building: $m"
          # smoke: install every host archive on a clean runner and use it
          smoke="$linux"
          [ "$HOSTS" = linux ] || smoke="$linux,$macos,{\"host\":\"windows-amd64\",\"os\":\"windows-latest\"}"
          echo "smoke_matrix=[$smoke]" >> "$GITHUB_OUTPUT"
      - id: v
        name: Tag matches Cargo.toml
        run: |
          cargo_version=$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -1)
          # v<version> or v<version>-(rc|beta|alpha).<n>
          if ! printf '%s\n' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-(rc|beta|alpha)\.[0-9]+)?$'; then
            echo "::error::tag $TAG is not v<version> or v<version>-rc.<n> (-beta.<n>, -alpha.<n>)"
            exit 1
          fi
          base=${TAG#v}; base=${base%%-*}
          if [ "$base" != "$cargo_version" ]; then
            echo "::error::tag $TAG does not match the workspace version $cargo_version in Cargo.toml (expected v$cargo_version or v$cargo_version-rc.<n>)"
            exit 1
          fi
          # the full string without "v": names the archives and fills VERSION
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          case "$TAG" in *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;; *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;; esac

  targets:
    name: targets (Linux, Windows link inputs)
    needs: meta
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.ref }}
      - name: LLVM 18
        run: sudo ./scripts/setup.sh
      - name: Cache of the pinned downloads
        uses: actions/cache@v4
        with:
          path: build/bundle-cache
          key: bundle-cache-${{ hashFiles('scripts/bundle-targets.sh') }}
          restore-keys: bundle-cache-
      - name: Link inputs
        run: |
          ./scripts/bundle-targets.sh --prebuilt x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu \
            x86_64-unknown-linux-musl aarch64-unknown-linux-musl x86_64-pc-windows-gnu
          du -sh build/targets/*
      - uses: actions/upload-artifact@v4
        with:
          name: targets-linux
          path: build/targets/
          if-no-files-found: error

  targets-macos:
    name: targets (macOS, real SDK)
    needs: meta
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.ref }}
      - name: LLVM 18
        run: brew install llvm@18
      - name: Link inputs (runtimes built against the SDK)
        run: |
          export CLANG="$(brew --prefix llvm@18)/bin/clang"
          ./scripts/bundle-targets.sh --prebuilt aarch64-apple-darwin x86_64-apple-darwin
          ./scripts/bundle-targets.sh --check-darwin-tbd
          cat build/targets/*/BUNDLE
      - uses: actions/upload-artifact@v4
        with:
          name: targets-macos
          path: build/targets/
          if-no-files-found: error

  unix:
    name: ${{ matrix.host }}
    needs: [meta, targets, targets-macos]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.meta.outputs.unix_matrix) }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.optional == true }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.ref }}
      - name: LLVM 18 (Linux)
        if: runner.os == 'Linux'
        run: sudo ./scripts/setup.sh
      - name: LLVM 18 (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm@18 lld zstd
          llvm=$(brew --prefix llvm@18)
          # Self-contained binaries: the Rust build must see only LLVM's static
          # archives, never Homebrew's lib directory. With -L<llvm>/lib on the
          # link line, -lc++ resolves to Homebrew's libc++.dylib, which
          # re-exports its libunwind.1.dylib, and bin/zell then depends on
          # /opt/homebrew (the otool check below fails). So llvm-sys gets a
          # shim prefix: libLLVM*.a by symlink in a directory of its own, and an
          # llvm-config wrapper answering --libdir/--ldflags with that directory.
          shim=$RUNNER_TEMP/llvm-static
          mkdir -p "$shim/bin" "$shim/lib"
          ln -s "$llvm/include" "$shim/include"
          # every static archive llvm-config may name (LLVM, Polly, ...), but no
          # libc++/libunwind: those must come from the OS
          for a in "$llvm"/lib/lib*.a; do
            case "$a" in *libunwind*|*libc++*) continue ;; esac
            ln -s "$a" "$shim/lib/"
          done
          # Homebrew's zstd (named by llvm-config --system-libs) statically too
          cp "$(brew --prefix zstd)/lib/libzstd.a" "$shim/lib/"
          cat > "$shim/bin/llvm-config" <<EOF
          #!/bin/sh
          for a in "\$@"; do
            case "\$a" in
              --libdir) echo "$shim/lib"; exit 0 ;;
              --ldflags) echo "-L$shim/lib"; exit 0 ;;
            esac
          done
          exec "$llvm/bin/llvm-config" "\$@"
          EOF
          chmod +x "$shim/bin/llvm-config"
          "$shim/bin/llvm-config" --version --libdir --ldflags
          echo "LLVM_SYS_180_PREFIX=$shim" >> "$GITHUB_ENV"
          echo "$llvm/bin" >> "$GITHUB_PATH"
      # rustup is preinstalled on the hosted runners; retried, since the
      # download of the toolchain sometimes fails on a DNS error.
      - name: Rust (stable)
        run: |
          for i in 1 2 3 4; do
            rustup toolchain install stable --profile minimal && rustup default stable && break
            echo "rustup failed (attempt $i), retrying"; sleep 20
          done
          rustc --version
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.host }}
      - name: Runtime
        run: |
          if [ "$RUNNER_OS" = macOS ]; then make -C runtime CC=clang -j"$(sysctl -n hw.ncpu)"; else make -C runtime -j"$(nproc)"; fi
      - uses: actions/download-artifact@v4
        with:
          name: targets-linux
          path: build/targets
      - uses: actions/download-artifact@v4
        with:
          name: targets-macos
          path: build/targets
      - name: Cache of bin/lld
        if: runner.os == 'macOS'
        uses: actions/cache@v4
        with:
          path: build/lld
          key: lld-18-${{ matrix.os }}-${{ hashFiles('scripts/build-lld.sh', 'scripts/lld/lld-main.cpp') }}
      - name: bin/lld
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get install -y liblld-18-dev libzstd-dev zlib1g-dev libncurses-dev
            ./scripts/build-lld.sh --prebuilt
          else
            brew install ninja
            [ -x build/lld/lld ] || LLVM_CONFIG="$(brew --prefix llvm@18)/bin/llvm-config" ./scripts/build-lld.sh --prebuilt
          fi
      - name: Compiler (release)
        run: |
          cargo build --release --bin zell --bin zell-lsp --bin zell-mcp
          if [ "$RUNNER_OS" = macOS ]; then
            # self-contained: only libraries of the OS
            for b in zell zell-lsp zell-mcp; do
              otool -L "target/release/$b"
              if otool -L "target/release/$b" | tail -n +2 | grep -v -e '^[[:space:]]*/usr/lib/' -e '^[[:space:]]*/System/'; then
                echo "::error::target/release/$b depends on libraries outside macOS"; exit 1
              fi
            done
          else
            ldd target/release/zell
          fi
      - name: Package
        run: ./scripts/package-toolchain.sh --no-build --out dist --version "${{ needs.meta.outputs.version }}" && ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.host }}
          path: dist/
          if-no-files-found: error

  windows:
    name: windows-amd64
    needs: [meta, targets, targets-macos]
    if: github.event_name == 'push' || inputs.hosts == 'all'
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.ref }}
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            make
            mingw-w64-x86_64-clang
            mingw-w64-x86_64-lld
            mingw-w64-x86_64-llvm
      - name: Runtime (MinGW ABI)
        run: make -C runtime CROSS=x86_64-w64-mingw32 -j"$(nproc)"
      # llvm-sys needs llvm-config and static LLVM libraries with every
      # target the compiler initialises (X86, AArch64, WebAssembly): the
      # official clang+llvm tarball for MSVC has both (the installer has
      # neither). Its llvm-config lists libxml2s.lib, needed only by
      # LLVMWindowsManifest, which nothing links: a stub library stands in.
      # LLVM is built against the dynamic CRT (/MD), so the Rust code is too.
      - name: LLVM 18 for the compiler (MSVC)
        shell: pwsh
        run: |
          $name = "clang+llvm-18.1.8-x86_64-pc-windows-msvc"
          $prefix = Join-Path $env:RUNNER_TEMP $name
          if (-not (Test-Path "$prefix\bin\llvm-config.exe")) {
            Invoke-WebRequest "https://github.com/llvm/llvm-project/releases/download/llvmorg-18.1.8/$name.tar.xz" -OutFile "$env:RUNNER_TEMP\llvm.tar.xz"
            tar -xf "$env:RUNNER_TEMP\llvm.tar.xz" -C "$env:RUNNER_TEMP" "$name/bin/llvm-config.exe" "$name/bin/clang-cl.exe" "$name/bin/llvm-lib.exe" "$name/bin/lld.exe" "$name/lib" "$name/include"
            if ($LASTEXITCODE -ne 0) { throw "extracting LLVM failed" }
            Remove-Item "$env:RUNNER_TEMP\llvm.tar.xz"
          }
          Set-Content -Path "$env:RUNNER_TEMP\xml2stub.c" -Value "int zell_libxml2_stub;"
          & "$prefix\bin\clang-cl.exe" /nologo /c "$env:RUNNER_TEMP\xml2stub.c" "/Fo$env:RUNNER_TEMP\xml2stub.obj"
          & "$prefix\bin\llvm-lib.exe" /nologo "/out:$prefix\lib\libxml2s.lib" "$env:RUNNER_TEMP\xml2stub.obj"
          if ($LASTEXITCODE -ne 0) { throw "libxml2s.lib stub failed" }
          & "$prefix\bin\llvm-config.exe" --version --targets-built --system-libs
          "LLVM_SYS_180_PREFIX=$prefix" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Rust (stable, MSVC)
        shell: pwsh
        run: |
          foreach ($i in 1..4) {
            rustup toolchain install stable --profile minimal --target x86_64-pc-windows-msvc
            if ($LASTEXITCODE -eq 0) { rustup default stable; break }
            Write-Host "rustup failed (attempt $i), retrying"; Start-Sleep 20
          }
          rustc --version
          if ($LASTEXITCODE -ne 0) { throw "no Rust toolchain" }
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-windows-amd64
      - name: Compiler (release)
        shell: pwsh
        run: |
          cargo build --release --target x86_64-pc-windows-msvc --bin zell --bin zell-lsp --bin zell-mcp
          if ($LASTEXITCODE -ne 0) { throw "cargo build failed" }
          New-Item -ItemType Directory -Force -Path target\release | Out-Null
          Copy-Item target\x86_64-pc-windows-msvc\release\zell.exe, target\x86_64-pc-windows-msvc\release\zell-lsp.exe, target\x86_64-pc-windows-msvc\release\zell-mcp.exe target\release\
          .\target\release\zell.exe version
      - uses: actions/download-artifact@v4
        with:
          name: targets-linux
          path: build/targets
      - uses: actions/download-artifact@v4
        with:
          name: targets-macos
          path: build/targets
      # bin/lld.exe: the official LLVM 18.1.8 lld (same /MD runtime as zell.exe;
      # package-toolchain.sh copies the Visual C++ DLLs next to both)
      - name: bin/lld
        run: LLD_BINARY="$(cygpath -u "$RUNNER_TEMP")/clang+llvm-18.1.8-x86_64-pc-windows-msvc/bin/lld.exe" ./scripts/build-lld.sh --prebuilt
      - name: Package
        run: ./scripts/package-toolchain.sh --no-build --out dist --version "${{ needs.meta.outputs.version }}" && ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows-amd64
          path: dist/
          if-no-files-found: error

  # Install each host archive on a clean runner of that host (nothing else
  # installed: no clang, no SDK) and use it like a user would: a new package
  # (init, run, build --release, test), a set of examples byte-exact against
  # their .out, and one cross build for another OS from the bundled SDK.
  smoke:
    name: smoke ${{ matrix.host }}
    needs: [meta, unix, windows]
    if: always() && needs.meta.result == 'success' && needs.unix.result == 'success' && (needs.windows.result == 'success' || needs.windows.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.meta.outputs.smoke_matrix) }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.optional == true }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.ref }}
      - uses: actions/download-artifact@v4
        with:
          name: dist-${{ matrix.host }}
          path: dist
      - name: Install from the archive
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          HOST: ${{ matrix.host }}
        run: |
          arc=$(ls "dist/zell-$VERSION-$HOST.tar.xz" "dist/zell-$VERSION-$HOST.tar.gz" 2>/dev/null | head -1)
          [ -n "$arc" ] || { echo "::error::no archive for $HOST in dist/"; ls dist; exit 1; }
          mkdir -p "$HOME/zell" && tar xf "$arc" -C "$HOME/zell" --strip-components=1
          ls "$HOME/zell/bin" "$HOME/zell/targets"
          echo "$HOME/zell/bin" >> "$GITHUB_PATH"
      - name: zell version, zell env
        run: zell version && zell env
      - name: New package - init, run, build --release, test
        run: |
          mkdir smoke-pkg && cd smoke-pkg
          zell init
          out=$(zell run | tr -d '\r')
          [ "$out" = "Hello, world!" ] || { echo "::error::zell run printed: $out"; exit 1; }
          zell build --release
          zell test
      - name: Examples byte-exact
        run: |
          fail=0
          for e in hello structs enums errors defer slices_maps strings stdlib_strings2 json async stdlib_crypto; do
            if ! out=$(zell run "examples/$e.zl" 2>&1 | tr -d '\r'); then
              echo "::error::examples/$e.zl failed:"; printf '%s\n' "$out"; fail=1; continue
            fi
            if [ "$out" != "$(cat "examples/$e.out")" ]; then
              echo "::error::examples/$e.zl output differs from $e.out"; diff <(printf '%s\n' "$out") "examples/$e.out" || true; fail=1
            fi
          done
          exit $fail
      - name: Cross build from the bundled SDK
        run: |
          case "${{ matrix.host }}" in
            windows-*) t=linux-amd64; o=hello-linux ;;
            *)         t=windows-amd64; o=hello.exe ;;
          esac
          zell build examples/hello.zl --target "$t" -o "$o"
          ls -l "$o"

  release:
    needs: [meta, unix, windows, smoke]
    # The Windows job is skipped for hosts=linux; every job that ran must have passed.
    if: always() && needs.meta.result == 'success' && needs.unix.result == 'success' && needs.smoke.result == 'success' && (needs.windows.result == 'success' || needs.windows.result == 'skipped')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.ref }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect assets
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          HOSTS: ${{ github.event_name == 'push' && 'all' || inputs.hosts }}
        run: |
          mkdir -p release
          # A host's own runtime archive wins over the same triple cross-built
          # on Linux: the native artifacts are copied first, cp -n keeps them.
          for d in artifacts/dist-windows-amd64 artifacts/dist-macos-arm64 artifacts/dist-macos-amd64 \
                   artifacts/dist-linux-arm64 artifacts/dist-linux-amd64; do
            [ -d "$d" ] || { echo "::warning::no assets from ${d#artifacts/dist-}"; continue; }
            for f in "$d"/*.tar.gz "$d"/*.tar.xz; do
              [ -f "$f" ] || continue
              b=$(basename "$f")
              [ -e "release/$b" ] && continue
              cp "$f" "$f.sha256" release/
            done
          done
          printf '%s\n' "$VERSION" > release/VERSION
          (cd release && sha256sum -c ./*.sha256 && sha256sum ./*.tar.* | grep -v '\.sha256$' | sed 's| \./| |' > SHA256SUMS)
          hosts="linux-amd64 macos-arm64 macos-amd64 windows-amd64"
          [ "$HOSTS" = linux ] && hosts="linux-amd64"
          for h in $hosts; do
            ls "release/zell-$VERSION-$h".tar.* >/dev/null 2>&1 || { echo "::error::missing zell-$VERSION-$h.tar.xz"; exit 1; }
          done
          ls -l release
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: release/
      - name: Create the GitHub Release
        if: github.event_name == 'push' || !inputs.dry_run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG" 2>/dev/null || true
          notes=release-notes.md
          if [ "$(git cat-file -t "$TAG" 2>/dev/null)" = tag ]; then
            git for-each-ref "refs/tags/$TAG" --format='%(contents)' | sed '/-----BEGIN PGP SIGNATURE-----/,$d' > "$notes"
          fi
          [ -s "$notes" ] || printf 'Zell %s\n' "$TAG" > "$notes"
          cat >> "$notes" <<'NOTES'

          ### Install

              curl -fsSL https://raw.githubusercontent.com/zell-lang/zell/master/scripts/install.sh | sh
              irm https://raw.githubusercontent.com/zell-lang/zell/master/scripts/install.ps1 | iex   # Windows

          Other targets: `zell target add <target>`. Checksums: `SHA256SUMS`.
          NOTES
          case "$TAG" in *-*) printf '\nPre-release: install with `sh install.sh --version %s` (it is not the latest release). macOS, until the binaries are signed: `xattr -dr com.apple.quarantine <dir>`.\n' "${TAG#v}" >> "$notes" ;; esac
          # a candidate (v<version>-rc.<n>, -beta, -alpha) is a pre-release: never
          # `releases/latest`. A tag that does not exist yet is created
          # server-side on the built commit (no tag push from the workflow).
          pre=""
          case "$TAG" in *-*) pre=--prerelease ;; esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
          elif git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            gh release create "$TAG" release/* --title "Zell $TAG" --notes-file "$notes" --verify-tag $pre
          else
            gh release create "$TAG" release/* --title "Zell $TAG" --notes-file "$notes" --target "$(git rev-parse HEAD)" $pre
          fi
