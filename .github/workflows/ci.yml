# CI matrix of docs/PLATFORMS.md: the compiler and the runtime on every
# tier-1 host, plus cross builds from Linux (Windows executables run under
# Wine, linux-arm64 under QEMU, static musl binaries natively, macOS objects
# and a stub-SDK compile check of the runtime without an SDK). Every host
# job packages its toolchain (scripts/package-toolchain.sh) as an artifact;
# the cross job adds the runtime archives that `zell target add` fetches.
name: ci

# Manual only (workflow_dispatch): the suites are run locally before a push;
# start a run from the Actions tab or `gh workflow run ci.yml` when needed.
on:
  workflow_dispatch:
    inputs:
      only:
        description: "Run every job, or only the macos-arm64 job"
        type: choice
        options: [all, macos-arm64]
        default: all

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: linux-${{ matrix.arch }}
    if: github.event_name != 'workflow_dispatch' || inputs.only == 'all'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            os: ubuntu-24.04
          - arch: arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (LLVM 18, clang, lld)
        run: sudo ./scripts/setup.sh
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-linux-${{ matrix.arch }}
      - name: Runtime
        run: make -C runtime -j"$(nproc)" && make -C runtime test
      - name: Runtime under ThreadSanitizer
        if: matrix.arch == 'amd64'
        run: make -C runtime tsan
      - name: Compiler, examples, spec corpus
        run: cargo build --workspace && cargo test --workspace
      - name: Hello world size
        run: cargo build --release && ./scripts/bench-size.sh
      - name: Toolchain archive
        run: ./scripts/package-toolchain.sh --no-build --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: zell-linux-${{ matrix.arch }}
          path: dist/

  macos:
    name: macos-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.only == 'macos-arm64' && '[{"arch":"arm64","os":"macos-14"}]' || '[{"arch":"arm64","os":"macos-14"},{"arch":"amd64","os":"macos-15-intel"}]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: LLVM 18
        run: |
          brew install llvm@18 lld zstd
          echo "LLVM_SYS_180_PREFIX=$(brew --prefix llvm@18)" >> "$GITHUB_ENV"
          # llvm-config --system-libs names -lzstd (Homebrew), which is not on
          # the default linker path
          echo "LIBRARY_PATH=$(brew --prefix)/lib" >> "$GITHUB_ENV"
          echo "$(brew --prefix llvm@18)/bin" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-macos
      - name: Runtime (kqueue poller, POSIX layer)
        run: |
          make -C runtime CC=clang -j"$(sysctl -n hw.ncpu)"
          make -C runtime CC=clang test || {
            # where a crashing test stopped (stderr of lldb goes to the log)
            for t in runtime/build/tests/test_*; do
              case "$t" in *.*) continue ;; esac
              "$t" > "$t.out" 2>&1 && continue
              echo "== $t failed (status $?); its output:"
              tail -40 "$t.out"
              echo "== $t under lldb:"
              lldb --batch -o run -k "thread backtrace all" -k quit -- "$t" 2>&1 | tail -80
            done
            exit 1
          }
      - name: Compiler, examples, spec corpus
        run: |
          # Apple's lldb (Xcode 15) lacks the formatters' --recognizer-function:
          # put Homebrew's lldb first (only lldb, so clang stays LLVM 18)
          brew install llvm >/dev/null 2>&1 || true
          for d in "$(brew --prefix llvm)/bin" "$(brew --prefix lldb 2>/dev/null)/bin"; do
            if [ -x "$d/lldb" ]; then
              mkdir -p "$RUNNER_TEMP/lldb-bin" && ln -sf "$d/lldb" "$RUNNER_TEMP/lldb-bin/lldb"
              export PATH="$RUNNER_TEMP/lldb-bin:$PATH"
              break
            fi
          done
          which -a lldb dsymutil || true
          lldb --version || true
          # macOS caps listen backlogs at kern.ipc.somaxconn (128): the
          # many-connections tests dial thousands at once (Linux: 4096)
          sudo sysctl -w kern.ipc.somaxconn=4096 || true
          cargo build --workspace
          # where debug info ends up (the lldb tests rely on the dSYM)
          mkdir -p "$RUNNER_TEMP/dbg"
          ./target/debug/zell build --verbose examples/hello.zl -o "$RUNNER_TEMP/dbg/hello" || true
          ls -la "$RUNNER_TEMP/dbg" || true
          dwarfdump --uuid "$RUNNER_TEMP/dbg/hello" "$RUNNER_TEMP/dbg/hello.dSYM" || true
          lldb --batch -o "image list" -o "b hello.zl:6" -o "image lookup -n main" "$RUNNER_TEMP/dbg/hello" || true
          cargo test --workspace --no-fail-fast
      - name: macOS port checks (kqueue, sampler, symbols, tz, roots, processes, packaging)
        run: cargo build --release && ./scripts/macos-verify.sh --quick
      - name: Toolchain archive
        run: ./scripts/package-toolchain.sh --no-build --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: zell-macos-${{ matrix.arch }}
          path: dist/

  windows:
    name: windows-amd64
    if: github.event_name != 'workflow_dispatch' || inputs.only == 'all'
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            make
            mingw-w64-x86_64-clang
            mingw-w64-x86_64-lld
            mingw-w64-x86_64-llvm
      - name: Runtime (MinGW ABI) and its C tests, natively
        # CROSS selects the Windows build (win32.c, net_win32.c, the IOCP
        # poller); WINE= runs the test binaries directly instead of under Wine.
        run: |
          make -C runtime CROSS=x86_64-w64-mingw32 -j"$(nproc)"
          make -C runtime CROSS=x86_64-w64-mingw32 test-wine WINE=
          ZELL_POLLER=wsapoll make -C runtime CROSS=x86_64-w64-mingw32 test-wine WINE=
          # the compiler tests look for runtime/libzell_rt.a (`make -C runtime`
          # elsewhere); here that is the Windows runtime
          cp runtime/build/x86_64-pc-windows-gnu/libzell_rt.a runtime/libzell_rt.a
      # llvm-sys needs llvm-config and static LLVM libraries with every
      # target the compiler initialises (X86, AArch64, WebAssembly): the
      # official clang+llvm tarball for MSVC has both (the installer has
      # neither). Its llvm-config lists libxml2s.lib, needed only by
      # LLVMWindowsManifest, which nothing links: a stub library stands in.
      # LLVM is built against the dynamic CRT (/MD), so the Rust code is too.
      - name: LLVM 18 for the compiler (MSVC)
        shell: pwsh
        run: |
          $name = "clang+llvm-18.1.8-x86_64-pc-windows-msvc"
          $prefix = Join-Path $env:RUNNER_TEMP $name
          if (-not (Test-Path "$prefix\bin\llvm-config.exe")) {
            Invoke-WebRequest "https://github.com/llvm/llvm-project/releases/download/llvmorg-18.1.8/$name.tar.xz" -OutFile "$env:RUNNER_TEMP\llvm.tar.xz"
            tar -xf "$env:RUNNER_TEMP\llvm.tar.xz" -C "$env:RUNNER_TEMP" "$name/bin/llvm-config.exe" "$name/bin/clang-cl.exe" "$name/bin/llvm-lib.exe" "$name/lib" "$name/include"
            if ($LASTEXITCODE -ne 0) { throw "extracting LLVM failed" }
            Remove-Item "$env:RUNNER_TEMP\llvm.tar.xz"
          }
          Set-Content -Path "$env:RUNNER_TEMP\xml2stub.c" -Value "int zell_libxml2_stub;"
          & "$prefix\bin\clang-cl.exe" /nologo /c "$env:RUNNER_TEMP\xml2stub.c" "/Fo$env:RUNNER_TEMP\xml2stub.obj"
          & "$prefix\bin\llvm-lib.exe" /nologo "/out:$prefix\lib\libxml2s.lib" "$env:RUNNER_TEMP\xml2stub.obj"
          if ($LASTEXITCODE -ne 0) { throw "libxml2s.lib stub failed" }
          & "$prefix\bin\llvm-config.exe" --version --targets-built --system-libs
          "LLVM_SYS_180_PREFIX=$prefix" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-windows
      - name: Compiler and examples
        shell: pwsh
        run: |
          $env:PATH = "C:\msys64\mingw64\bin;$env:PATH"
          cargo build --workspace
          if ($LASTEXITCODE -ne 0) { throw "cargo build failed" }
          cargo test --workspace
          if ($LASTEXITCODE -ne 0) { throw "cargo test failed" }

  cross:
    name: cross (linux -> windows, linux-arm64, musl, macos)
    if: github.event_name != 'workflow_dispatch' || inputs.only == 'all'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (LLVM 18, mingw-w64, Wine, aarch64 gcc + QEMU, musl)
        run: |
          sudo ./scripts/setup.sh
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y mingw-w64 wine64 gcc-aarch64-linux-gnu qemu-user-static musl-tools
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-cross
      - name: Runtime for Windows (-Werror) and its C tests under Wine
        run: |
          make -C runtime -j"$(nproc)"
          make -C runtime CROSS=x86_64-w64-mingw32 -j"$(nproc)"
          make -C runtime CROSS=x86_64-w64-mingw32 test-wine
      - name: Runtime for linux-arm64 (C tests under QEMU) and linux-amd64-musl (static)
        run: |
          make -C runtime CROSS=aarch64-linux-gnu -j"$(nproc)" && make -C runtime CROSS=aarch64-linux-gnu test-cross
          make -C runtime CROSS=x86_64-linux-musl -j"$(nproc)" && make -C runtime CROSS=x86_64-linux-musl test-cross
      - name: macOS runtime compile check against runtime/stub-sdk/macos (no SDK here)
        run: make -C runtime CROSS=aarch64-apple-darwin -j"$(nproc)" && make -C runtime CROSS=x86_64-apple-darwin -j"$(nproc)"
      - name: Examples for windows-amd64 (Wine, IOCP and WSAPoll), linux-arm64 (QEMU), musl; macos objects
        run: cargo test -p zell --test cross -- --include-ignored
      - name: Cross hello world sizes
        run: cargo build --release && ./scripts/bench-size.sh
      - name: Runtime archives for `zell target add`
        run: ./scripts/package-toolchain.sh --no-build --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: zell-runtimes
          path: dist/zell-runtime-*
