# Builds the documentation site (README, docs/guide, design docs and the
# std API reference; `zell doc --site`) and deploys it to GitHub Pages.
# Enable it once: Settings -> Pages -> Source: GitHub Actions.
name: docs

# Manual only: start from the Actions tab or `gh workflow run docs.yml`.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      pages: ${{ steps.pages.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM 18
        run: sudo ./scripts/setup.sh
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the compiler
        run: cargo build --release -p zell
      - name: Build the site
        run: ./target/release/zell doc --site site --base "/${{ github.event.repository.name }}/"
      # Pages is a repository setting (Settings -> Pages -> Source: GitHub
      # Actions); until it is on, the site is built and kept as an artifact
      # and the deployment is skipped instead of failing the workflow.
      - id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true
      - name: Pages not enabled
        if: steps.pages.outcome != 'success'
        run: >-
          echo "::warning::GitHub Pages is not enabled for this repository (Settings -> Pages -> Source: GitHub Actions); the site was built but not deployed. It is attached to this run as the 'site' artifact."
      - if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - if: steps.pages.outcome != 'success'
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: site

  deploy:
    needs: build
    if: needs.build.outputs.pages == 'true'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
